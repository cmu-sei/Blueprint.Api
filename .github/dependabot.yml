version: 2
updates:
  # GitHub Actions used by .github/workflows, including the floating-tag
  # cmu-sei/Crucible-Github-Actions refs (bumped only if a dotted tag appears).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait before taking new releases: hijacked versions are usually caught and pulled within days.
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: chore(deps)

  # Base images in the root Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Wait before taking new releases: hijacked versions are usually caught and pulled within days.
    cooldown:
      default-days: 5

  # The API's NuGet dependencies.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    # Wait before taking new releases: hijacked versions are usually caught and pulled within days.
    cooldown:
      default-days: 5
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      minor-and-patch:
        # A group without patterns outranks every other group's wildcard.
        patterns: ["*"]
        update-types: [minor, patch]
    # These later versions need a commercial license.
    ignore:
      - dependency-name: AutoMapper
        versions: [">= 15.0.0"]
      - dependency-name: MediatR
        versions: [">= 13.0.0"]
      # Swashbuckle 10.3.1 cannot generate the DataTable schema MselController.GetData returns;
      # the API and the swagger CLI move together, by hand, once that is fixed.
      - dependency-name: "Swashbuckle.AspNetCore*"
        versions: [">= 10.1.0"]
      - dependency-name: swashbuckle.aspnetcore.cli
        versions: [">= 10.1.0"]

  # NSwag, used by the client package build (Blueprint.Api.Client/package.json).
  - package-ecosystem: npm
    directory: /Blueprint.Api.Client
    schedule:
      interval: weekly
    # Wait before taking new releases: hijacked versions are usually caught and pulled within days.
    cooldown:
      default-days: 5
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
